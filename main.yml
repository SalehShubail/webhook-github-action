name: Deploy to Render

on:
  push:
    branches:
      - main  # سيتم تشغيل هذا الإجراء عند دفع تغييرات إلى الفرع `main`

jobs:
  deploy:
    runs-on: ubuntu-latest  # استخدام أحدث بيئة من Linux لتشغيل الأوامر

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v3  # خطوة لتحميل الكود من GitHub

      - name: ⚙️ Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # تثبيت نسخة Node.js

      - name: 📦 Install dependencies
        run: npm install  # تثبيت الحزم المطلوبة من `package.json`

      - name: 🚀 Deploy to Render
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}  # معرف الخدمة من Render
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}  # مفتاح API من Render
        run: |
          curl -X POST \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys  # نشر الكود على Render
